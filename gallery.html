<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | TerpFocus</title>
    <meta
      name="description"
      content="Browse TerpFocus cannabis studio, product, concentrate, and ultra-macro photography."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#050608" />
    <link rel="canonical" href="https://terpfocus.com/gallery.html" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TerpFocus" />

    <meta
      property="og:description"
      content="Browse TerpFocus cannabis studio, product, concentrate, and ultra-macro photography."
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TerpFocus cannabis photography gallery" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@terpfocus" />
    <meta name="twitter:title" content="Gallery | TerpFocus" />
    <meta
      name="twitter:description"
      content="Browse TerpFocus cannabis studio, product, concentrate, and ultra-macro photography."
    />
    <meta name="twitter:image" content="https://terpfocus.com/media/og-cover.jpg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["CollectionPage", "ImageGallery"],
        "name": "Gallery | TerpFocus",
        "url": "https://terpfocus.com/gallery.html",
        "primaryImageOfPage": "https://terpfocus.com/media/og-cover.jpg",

          "@type": "WebSite",
          "name": "TerpFocus",
          "url": "https://terpfocus.com/"
        }
      }

            <span class="font-display text-lg font-bold tracking-tight text-white">TerpFocus</span>

              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
        </div>

        <div id="mobile-nav-menu" class="hidden md:hidden border-t border-white/[0.06] py-4 space-y-2">
          <a href="/" class="block px-2 py-2 text-sm text-zinc-300 hover:text-[#00E082]">Home</a>
          <a href="/gallery.html" class="block px-2 py-2 text-sm text-[#00E082]">Gallery</a>
          <a
            href="/#inquire"

          >
            Book a Shoot
          </a>
        </div>

          <h1 class="font-display text-3xl sm:text-4xl font-bold tracking-tight text-white">
            Gallery

        <div id="archive-grid" class="mt-8 columns-1 sm:columns-2 lg:columns-3 gap-5"></div>
      </div>

      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 flex flex-col sm:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <picture class="inline-block shrink-0">
            <source srcset="/media/logo.webp" type="image/webp" />
